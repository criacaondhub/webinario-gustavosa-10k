server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecionamentos relativos (evita voltar para http:// ou para a porta 80 atrás do Traefik)
    absolute_redirect off;

    # /protocolo-10k → /protocolo-10k/
    location = /protocolo-10k {
        return 301 /protocolo-10k/;
    }

    # JS/CSS gerados pelo Vite têm hash no nome → cache longo e imutável
    # (regex entre aspas: o nginx lê "{" sem aspas como início de bloco e não sobe)
    location ~* "^/protocolo-10k/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagens de public/assets mantêm o nome original (podem ser trocadas) → cache de 1 dia
    location /protocolo-10k/assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Painel de inscrições (dados pessoais): fora dos buscadores também pelo cabeçalho HTTP
    # (/protocolo-10k/api/* nunca chega aqui: o Traefik manda direto para a API)
    location /protocolo-10k/dash/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /protocolo-10k/dash/index.html;
    }

    # Página (SPA): sempre revalida o index.html para publicar mudanças na hora
    location /protocolo-10k/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /protocolo-10k/index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
